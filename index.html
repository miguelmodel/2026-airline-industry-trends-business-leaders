<body>
  <div id="stage">
    <div id="slide-scaler">
      <div id="slide-container"><!-- slide articles injected here --></div>
      <div id="slide-counter">1 / 14</div>
      <div id="section-label"></div>
    </div>
  </div>

  <button id="nav-prev" class="nav-arrow" aria-label="Previous slide">&#8249;</button>
  <button id="nav-next" class="nav-arrow" aria-label="Next slide">&#8250;</button>

  <div class="top-controls">
    <button id="notes-toggle" class="icon-btn" aria-label="Toggle speaker notes" aria-pressed="false" title="Speaker notes (N)">&#9776;</button>
    <button id="admin-toggle" class="icon-btn" aria-label="Open settings" aria-expanded="false" title="Settings (A)">&#9881;</button>
  </div>

  <aside class="speaker-notes-overlay" id="notes-overlay" aria-label="Speaker notes">
    <div class="sn-title">Speaker Notes</div>
    <div class="sn-body" id="notes-body"></div>
  </aside>

  <div id="admin-overlay">
    <div id="admin-panel" role="dialog" aria-label="Presentation settings" aria-modal="true">
      <div class="admin-head">
        <h2>Settings</h2>
        <button id="admin-close" aria-label="Close settings">&times;</button>
      </div>

      <div class="admin-section">
        <span class="as-label">Theme</span>
        <div class="theme-grid" id="theme-grid"></div>
      </div>

      <div class="admin-section">
        <span class="as-label">Display</span>
        <div class="toggle-row">
          <label for="sw-notes">Speaker notes</label>
          <span class="switch"><input type="checkbox" id="sw-notes" /><span class="slider"></span></span>
        </div>
        <div class="toggle-row">
          <label for="sw-num">Slide number</label>
          <span class="switch"><input type="checkbox" id="sw-num" checked /><span class="slider"></span></span>
        </div>
        <div class="toggle-row">
          <label for="sw-section">Section label</label>
          <span class="switch"><input type="checkbox" id="sw-section" checked /><span class="slider"></span></span>
        </div>
      </div>

      <div class="admin-section">
        <span class="as-label">Go to slide</span>
        <div class="goto-row">
          <input type="number" id="goto-input" min="1" max="14" placeholder="1–14" aria-label="Slide number" />
          <button class="admin-btn" id="goto-btn">Go</button>
        </div>
      </div>

      <div class="admin-section">
        <span class="as-label">Export</span>
        <button class="admin-btn full" id="pdf-btn">Export to PDF</button>
      </div>

      <div class="admin-section">
        <span class="as-label">Slides</span>
        <div class="checklist" id="checklist"></div>
      </div>
    </div>
  </div>
